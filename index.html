<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jhumka Base</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#7335a8">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one calm column on a soft grey ground, white rounded cards, a floating pill nav with a black add button in the middle. */
:root{
  --bg:#ececee;
  --card:#ffffff;
  --fg:#121214;
  --mute:#6c6c73;
  --faint:#a6a6ad;
  --line:#e8e8eb;
  --chip:#f1f1f3;
  --field:#f5f5f7;
  --ink:#0f0f11;
  --on-ink:#ffffff;
  --good:#1d7a4b;
  --bad:#b3362d;
  --bar:#121214;
  --bar-dim:#d2d2d7;
    --accent:#7335a8;
  --glass:rgba(255,255,255,.5);--glass-hi:rgba(255,255,255,.72);
  --glass-line:rgba(255,255,255,.75);--glow1:rgba(115,53,168,.16);--glow2:rgba(255,160,120,.14);
  --shadow:0 1px 0 rgba(0,0,0,.03),0 10px 32px rgba(0,0,0,.05);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0d;--card:#161618;--fg:#f3f3f5;--mute:#9b9ba4;--faint:#62626b;--line:#26262b;--chip:#222227;--field:#1e1e22;
    --ink:#f3f3f5;--on-ink:#0b0b0d;--good:#5cc891;--bad:#f2867d;--bar:#f3f3f5;--bar-dim:#3b3b43;--accent:#b982ec;--glass:rgba(34,34,42,.46);--glass-hi:rgba(255,255,255,.13);--glass-line:rgba(255,255,255,.22);--glow1:rgba(150,80,230,.28);--glow2:rgba(60,120,255,.16);
    --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0d;--card:#161618;--fg:#f3f3f5;--mute:#9b9ba4;--faint:#62626b;--line:#26262b;--chip:#222227;--field:#1e1e22;
  --ink:#f3f3f5;--on-ink:#0b0b0d;--good:#5cc891;--bad:#f2867d;--bar:#f3f3f5;--bar-dim:#3b3b43;--accent:#b982ec;--glass:rgba(34,34,42,.46);--glass-hi:rgba(255,255,255,.13);--glass-line:rgba(255,255,255,.22);--glow1:rgba(150,80,230,.28);--glow2:rgba(60,120,255,.16);
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 140px;
}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{font-size:21px;font-weight:800;letter-spacing:-.035em;min-width:0}
.brand span{font-weight:500;color:var(--mute);margin-left:6px}
.tools{display:flex;align-items:center;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--fg);display:grid;place-items:center;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.avatar{width:42px;height:42px;border-radius:50%;border:0;padding:0;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:16px;cursor:pointer}
.avatar svg{width:20px;height:20px}
.avatar[aria-current="page"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.pf{display:flex;align-items:center;gap:16px;padding:18px 0 8px}
.pf-av{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:28px;font-weight:800;flex:none}
.pf-t{min-width:0}
.pf-n{font-size:22px;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.pf-s{color:var(--mute);margin-top:2px;overflow-wrap:anywhere}
.you{display:inline-block;margin-left:6px;background:var(--chip);color:var(--mute);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;vertical-align:middle}
.lnk{display:block;margin:4px 0 0 auto;border:0;background:none;color:var(--bad);font-weight:600;font-size:12.5px;padding:2px 0}
.lnk.armed{text-decoration:underline}
.pf-note{margin:14px 0 0;color:var(--mute);font-size:13.5px}
.pf-note b{color:var(--fg)}
div.row{cursor:default}
.avatar{overflow:hidden}
.avatar img,.pf-av img,.thumb.round img,.imgp.round img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.round{overflow:hidden}
.pf-av{overflow:hidden}
.imgp.round{border-radius:50%;width:84px;height:84px;font-size:30px;font-weight:800;color:var(--mute)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.cta .btn{flex:1 1 150px}
.btn svg{width:18px;height:18px;flex:none}
.eyebrow{margin:26px 0 12px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font-size:clamp(32px,9.4vw,44px);line-height:1.04;letter-spacing:-.04em;font-weight:700;text-wrap:balance}
h1 span{display:block;color:var(--faint);font-weight:600}

/* cards */
.card{background:var(--card);border-radius:28px;padding:22px;margin-top:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.lbl{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pill{background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--mute);white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;padding-top:18px}
.stats>div{min-width:0;padding-right:12px}
.stats>div+div{padding-left:18px;padding-right:0;border-left:1px solid var(--line)}
.slbl{font-size:13px;color:var(--mute);font-weight:500}
.big{margin-top:4px;font-size:clamp(23px,6.6vw,31px);font-weight:800;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.delta{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip)}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.card-h+.kv{border-top:0}
.kv span:first-child{color:var(--mute)}
.kv b{font-weight:700}
.kv.total{font-size:17px}
.kv.total b.pos{color:var(--good)}
.kv.total b.neg{color:var(--bad)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.row:first-child{border-top:0}
.thumb{width:46px;height:46px;border-radius:14px;background:var(--chip);object-fit:cover;display:grid;place-items:center;color:var(--faint);font-weight:700;font-size:16px}
.thumb.round{border-radius:50%;color:var(--mute)}
.r-t{font-weight:650;font-size:15px;overflow-wrap:anywhere}
.r-s{color:var(--mute);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.r-a{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.r-a small{display:block;font-weight:500;color:var(--mute);font-size:12.5px;margin-top:2px}
.warn{color:var(--bad)!important;font-weight:600}
.empty{padding:22px 0 4px}
.empty b{display:block;font-size:16px}
.empty p{margin:4px 0 16px;color:var(--mute)}
.loading{padding:22px 0 6px;color:var(--mute)}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:999px;padding:0 18px;height:50px}
.search svg{width:20px;height:20px;flex:none;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px}
.search:focus-within{outline:2px solid var(--fg);outline-offset:2px}

/* bars */
.bars{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.bar-t{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-variant-numeric:tabular-nums}
.bar-t span:first-child{color:var(--mute)}
.bar-t b{font-weight:700}
.track{height:8px;border-radius:999px;background:var(--chip);margin-top:7px;overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--bar)}

/* chart */
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.chart{display:block;width:100%;height:auto;margin-top:14px}
.chart .t{fill:var(--mute);font:600 10px var(--font)}
.chart .tv{fill:var(--fg);font:700 10.5px var(--font)}
.chart .g{stroke:var(--line);stroke-width:1;fill:none}
.chart .b{fill:var(--bar-dim)}
.chart .b.now{fill:var(--accent)}
.cap{margin:10px 0 0;color:var(--mute);font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:999px;border:0;font-weight:700;font-size:15px;background:var(--chip);color:var(--fg)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.sm{height:40px;padding:0 18px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}

/* banner */
.note{margin-top:14px;border-radius:20px;padding:14px 18px;background:var(--chip);color:var(--mute);font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note button{border:0;background:none;font-weight:700;color:var(--fg);padding:4px 0;text-decoration:underline}

/* ambient glow behind content so the glass nav has something to blur */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 40% at 15% 100%,var(--glow1),transparent 70%),radial-gradient(55% 40% at 90% 95%,var(--glow2),transparent 70%)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.pill-nav{pointer-events:auto;width:100%;max-width:520px;background:var(--card);background:linear-gradient(135deg,var(--glass-hi) 0%,var(--glass) 45%,var(--glass) 100%);-webkit-backdrop-filter:blur(32px) saturate(2) brightness(1.06);backdrop-filter:blur(32px) saturate(2) brightness(1.06);border-radius:999px;box-shadow:0 10px 36px rgba(0,0,0,.22),inset 0 1px 0 var(--glass-line),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 22px rgba(255,255,255,.06);border:1px solid var(--glass-line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:6px 0;color:var(--mute);font-size:10.5px;font-weight:600;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}
.add{justify-self:center;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.add svg{width:28px;height:28px}
.add[disabled]{opacity:.35}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:28px 28px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));outline:0}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:28px;max-height:90%}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.sh h2{margin:0;font-size:24px;letter-spacing:-.03em;font-weight:700}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.fld{margin-top:16px}
.fld>label,.lab{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
input[type=text],input[type=number],input[type=date],input[type=tel],input:not([type]),select,textarea{
  width:100%;border:1.5px solid transparent;background:var(--field);border-radius:16px;padding:14px 16px;font-size:16px;outline:0;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
input[readonly]{color:var(--mute)}
textarea{resize:vertical;min-height:84px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>.fld{min-width:0}
.hint{margin-top:8px;font-size:13px;color:var(--mute)}
.calc{display:flex;align-items:baseline;justify-content:space-between;margin-top:18px;padding:16px 18px;background:var(--field);border-radius:16px}
.calc span{color:var(--mute);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.calc b{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.imgf{display:flex;align-items:center;gap:14px}
.imgp{width:76px;height:76px;border-radius:18px;background:var(--field);display:grid;place-items:center;color:var(--faint);font-size:12px;font-weight:600;overflow:hidden;flex:none;text-align:center}
.imgp img{width:100%;height:100%;object-fit:cover;display:block}
.imgb{display:flex;gap:8px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.sr:focus-visible+label{outline:2px solid var(--fg);outline-offset:2px}
label.btn{cursor:pointer}
.err{margin-top:14px;color:var(--bad);font-size:14px;font-weight:600;min-height:0}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .primary{flex:1}
.menu{display:flex;flex-direction:column;margin-top:8px}
.menu button{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 0}
.menu button:first-child{border-top:0}
.menu .ic{width:44px;height:44px;border-radius:14px;background:var(--chip);display:grid;place-items:center}
.menu .ic svg{width:22px;height:22px}
.menu b{display:block;font-size:16px}
.menu small{color:var(--mute);font-size:13px}
.found{margin-top:10px;font-size:13px;color:var(--mute)}
.found b{color:var(--fg)}
details.opts{margin-top:10px}
details.opts summary{cursor:pointer;color:var(--mute);font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:6px 6px 6px 12px;font-size:13px;font-weight:600}
.chip button{border:0;background:var(--card);width:22px;height:22px;border-radius:50%;line-height:1;color:var(--mute)}
.addopt{display:flex;gap:8px;margin-top:10px}
.mini{margin-top:20px}
.mini .lab{margin-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .35s ease both}@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* v3: target, roles, payments, returns, import */
[hidden]{display:none!important}
.pill-nav{grid-template-columns:repeat(var(--n,5),1fr)}
.tgt{padding-top:18px}
.tgt-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.tgt-n{font-size:clamp(40px,12vw,56px);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.tgt-n small{font-size:15px;font-weight:600;letter-spacing:0;color:var(--mute)}
.track.tall{height:14px;margin-top:16px;margin-bottom:6px}
.track.tall .fill{background:var(--accent)}
.track.tall.done .fill{background:var(--good)}
.st{display:inline-block;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--chip);white-space:nowrap}
.st.ok{color:var(--good)}
.st.bad{color:var(--bad)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--good)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
@media (prefers-reduced-motion:no-preference){.live i{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}
.hrow{display:flex;align-items:center;gap:10px}
.tag{display:inline-block;margin-left:6px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;background:var(--chip);color:var(--mute);vertical-align:middle}
.tag.warn{color:var(--bad)}
.tag.good{color:var(--good)}
.cmp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 86px;gap:10px;align-items:center;padding:13px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.cmp.h{border-top:0;padding:14px 0 6px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.cmp .cl,.cmp .cp{color:var(--mute)}
.cmp b{overflow-wrap:anywhere}
.cmp .delta{margin:0;justify-self:end;white-space:nowrap}
.rolesel{width:auto;display:block;margin:6px 0 0 auto;border-radius:999px;padding:6px 30px 6px 12px;font-size:13px;font-weight:600;background-color:var(--chip)}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.qchip{border:0;background:var(--chip);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.row-btn{border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
.search .sc{border:0;background:var(--chip);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;flex:none}
.pv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:12px}
.qr{display:block;max-width:100%;height:auto;margin:14px auto 0;border-radius:12px;background:#fff}
.imp-wrap{overflow:auto;border-radius:12px;margin-top:10px;background:var(--field)}
.imp-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.imp-tbl td,.imp-tbl th{padding:7px 10px;text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-tbl th{color:var(--mute);font-weight:600}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;margin-top:10px}
.maprow label{font-size:14px;font-weight:600}
.maprow label small{color:var(--mute);font-weight:500}
.probs{margin:10px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.fld textarea.big{min-height:130px}
/* date filter */
.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.ff{flex:1 1 150px;min-width:0}
.ff label{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.pchips{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 100%}
.card .cap.sum{margin:16px 0 0;font-weight:600}
@media (min-width:900px){.ff{flex:0 0 200px}.pchips{flex:1 1 auto}}

/* desktop: wide column, tab bar under the header, cards in two columns */
@media (min-width:900px){
  .wrap{max-width:1180px}
  .top{padding:26px 0 8px}
  .brand{font-size:26px}
  .pill-nav{max-width:560px}
  .tab:hover{color:var(--fg)}
  #view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
  #view>*{min-width:0}
  #view>.eyebrow,#view>h1,#view>.cta,#view>.note,#view>.card.wide{grid-column:1/-1}
  #view>.eyebrow{margin:30px 0 0}
  #view>h1{margin-top:-4px}
  #view>.card{margin-top:0}
  #view>.cta{margin-top:20px}
  #view>.note{margin-top:0}
  #view>.eyebrow+.card,#view>.top+.card{margin-top:0}
  h1{font-size:52px}
  .cta{margin-top:20px}
  .cta .btn{flex:0 0 auto}
  .card{padding:26px 28px}
  .big{font-size:36px}
  .card.wide .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{cursor:pointer}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Jhumka<span>Base</span></div>
    <div class="tools">
      <button class="iconbtn" id="themebtn" type="button" data-act="theme"></button>
      <button class="avatar" id="avatarbtn" type="button" data-act="profile"></button>
    </div>
  </header>
  <nav class="nav" aria-label="Sections">
    <div class="pill-nav">
      <button class="tab" type="button" data-act="tab" data-tab="summary"></button>
      <button class="tab" type="button" data-act="tab" data-tab="purchases"></button>
      <button class="tab" type="button" data-act="tab" data-tab="products"></button>
      <button class="tab" type="button" data-act="tab" data-tab="expenses"></button>
      <button class="tab" type="button" data-act="tab" data-tab="customers"></button>
    </div>
  </nav>
  <main id="view" aria-live="polite"></main>
</div>


<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input class="sr" id="scan-file" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">

var DB=null,ASSETS=null,U=null,DL=null,PEND={},EDIT=null,toastT=null,armedT=null,IMP=null,SCAN_T=null,QRC=null;

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function r2(n){return Math.round(n*100)/100;}
function money(n){n=+n||0;var whole=Math.abs(n-Math.round(n))<0.005;return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:whole?0:2,maximumFractionDigits:whole?0:2});}
function compact(n){
  n=+n||0;
  function f(x,s){return '₹'+(Math.round(x*10)/10).toString().replace(/\.0$/,'')+s;}
  if(n>=1e7)return f(n/1e7,'Cr');
  if(n>=1e5)return f(n/1e5,'L');
  if(n>=1e3)return f(n/1e3,'k');
  return '₹'+Math.round(n);

function pad(n){return (n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

  var p=(s||'').split('-').map(Number);if(p.length<3||!p[0])return s||'';

function slug(s){return String(s||'').trim().toLowerCase().replace(/[^a-z0-9._~:@+-]+/g,'-').replace(/^-+|-+$/g,'');}

function byProduct(itemNo){var id=slug(itemNo);return S.products.filter(function(p){return p.id===id;})[0];}
function stockOf(itemNo){
  var k=slug(itemNo),n=0;
  S.purchases.forEach(function(p){if(slug(p.itemNo)===k)n+=+p.qty||0;});
  S.sales.forEach(function(s){if(slug(s.itemNo)===k)n-=+s.qty||0;});
  S.returns.forEach(function(r){
    if(slug(r.itemNo)!==k)return;

  });

}

  var max=0;
  S.products.concat(S.purchases).forEach(function(x){var m=/^jh-(\d+)$/i.exec(x.itemNo||'');if(m)max=Math.max(max,parseInt(m[1],10));});
  return 'JH-'+String(max+1).padStart(3,'0');
}
/* ---------- roles, payments, returns, target, activity ---------- */
var BOOTED=false;
var ROLE_NAMES={owner:'Owner',manager:'Manager',staff:'Packing staff'};
var ROLE_TXT={owner:'You see everything, set the monthly target and choose a role for each person.',manager:'You can see sales, stock, purchases and customers. Expenses and profit stay private to the owner.',staff:'You can see orders and stock, add orders and returns, and follow the monthly target.'};

  owner:{tabs:['summary','purchases','products','expenses','customers'],money:1,cost:1,profit:1,editProducts:1,collect:1,activity:1,manage:1,exp:1,export:1},
  manager:{tabs:['summary','purchases','products','customers'],money:1,cost:1,editProducts:1,collect:1,activity:1},
  staff:{tabs:['summary','products','customers']}
};
function myRole(){
  if(!BOOTED||S.offline||S.me.level==='Owner')return 'owner';
  for(var i=0;i<S.roles.length;i++)if(S.roles[i].id===S.me.id)return S.roles[i].role==='manager'?'manager':'staff';
  return 'staff';
}
function P(k){return !!PERM[myRole()][k];}
function tabList(){return PERM[myRole()].tabs;}
function tabLabel(t){if(myRole()==='staff'){if(t==='customers')return 'Orders';if(t==='products')return 'Stock';}return TABS[t].label;}
function roleOf(uid){for(var i=0;i<S.roles.length;i++)if(S.roles[i].id===uid)return S.roles[i].role==='manager'?'manager':'staff';return 'staff';}

function firstChar(s){
  s=String(s||'').trim();if(!s)return '';
  try{if(window.Intl&&Intl.Segmenter){var it=new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s)[Symbol.iterator]().next();if(!it.done)return it.value.segment.toUpperCase();}}catch(e){}
  return Array.from(s)[0].toUpperCase();
}
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);
}
function newId(c){return DB?DB.collection(c).doc().id:('l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));}

/* ---------- storage ---------- */
function clean(o){return JSON.parse(JSON.stringify(o));}
function saveLocal(){try{var o={cats:S.cats};COLS.forEach(function(c){o[c]=S[c];});localStorage.setItem(LS,JSON.stringify(o));}catch(e){}}
function loadLocal(){try{var d=JSON.parse(localStorage.getItem(LS)||'null');if(d){COLS.forEach(function(c){S[c]=d[c]||[];});S.cats=d.cats||S.cats;}}catch(e){}}
function localUpsert(c,id,data,merge){
  var list=S[c],i=list.findIndex(function(x){return x.id===id;});
  var rec=Object.assign({},merge&&i>=0?list[i]:{},clean(data),{id:id});
  if(i>=0)list[i]=rec;else list.push(rec);
  saveLocal();render();
}
async function put(c,id,data){
  if(DB){await DB.collection(c).doc(id).set(clean(data));}else{localUpsert(c,id,data,false);}
}
async function patch(c,id,data){
  if(DB){await DB.collection(c).doc(id).update(clean(data));}else{localUpsert(c,id,data,true);}
}
async function del(c,id){
  if(DB){await DB.collection(c).doc(id).delete();}
  else{S[c]=S[c].filter(function(x){return x.id!==id;});saveLocal();render();}
}
async function saveCats(list){
  S.cats=list;
  if(DB){await DB.doc('config/settings').set({cats:list});}else{saveLocal();}
}
function errText(e){
  var c=e&&e.code;
  if(c==='quota_exceeded')return 'Storage is full. Delete some entries or photos and try again.';
  if(c==='invalid_argument')return 'You can view these books but not change them.';
  return 'Could not save. Check your connection and try again.';
}

/* ---------- metrics ---------- */
function agg(inR){
  var o={sales:0,orders:0,units:0,cogs:0,loss:0,exp:0,refunds:0};
  S.sales.forEach(function(s){
    if(!inR(s.date))return;
    var q=+s.qty||0;o.sales+=+s.total||0;o.units+=q;o.cogs+=q*(+s.cost||0);if(orderCounts(s))o.orders++;
  });
  S.returns.forEach(function(r){
    if(!inR(r.date))return;
    var q=+r.qty||0,c=+r.cost||0;
    if(r.kind==='damage'){o.loss+=q*c;}
    else{var f=+r.refund||0;o.refunds+=f;o.sales-=f;o.units-=q;if(r.back)o.cogs-=q*c;}
  });
  S.expenses.forEach(function(e){if(inR(e.date))o.exp+=+e.total||0;});
  o.profit=o.sales-o.cogs-o.loss-o.exp;
  return o;
}
function metrics(){
  var now=new Date(),series=[],i;
  function mk(off){
    var d=new Date(now.getFullYear(),now.getMonth()-off,1),key=d.getFullYear()+'-'+pad(d.getMonth()+1);
    var a=agg(function(dt){return mkey(dt)===key;});
    a.key=key;a.label=d.toLocaleDateString('en-IN',{month:'short'});a.year=d.getFullYear();return a;
  }
  for(i=5;i>=0;i--)series.push(mk(i));
  var tot=agg(function(){return true;}),buy=0;
  S.purchases.forEach(function(p){buy+=+p.total||0;});
  var cur=series[5],prev=series[4];
  return {series:series,tot:tot,cur:cur,prev:prev,mk:mk,totalSales:tot.sales,totalUnits:tot.units,cogs:tot.cogs,loss:tot.loss,exp:tot.exp,buy:buy,
    monthSales:cur.sales,monthUnits:cur.units,prevSales:prev.sales,prevUnits:prev.units,prevLabel:prev.label,
    monthName:now.toLocaleDateString('en-IN',{month:'long',year:'numeric'}),profit:tot.profit};
}
function delta(cur,prev,lab){
  if(!cur&&!prev)return '';
  if(!prev)return '<span class="delta up">New this month</span>';
  var p=Math.round((cur-prev)/prev*100),up=p>=0;
  return '<span class="delta '+(up?'up':'down')+'">'+(up?'▲ ':'▼ ')+Math.abs(p)+'% vs '+esc(lab)+'</span>';
}
function niceMax(m){
  var p=Math.pow(10,Math.floor(Math.log10(m))),c=[1,2,2.5,5,10],i;
  for(i=0;i<c.length;i++){if(c[i]*p>=m)return c[i]*p;}
  return 10*p;
}
function chartSVG(series,mode){
  var W=340,H=196,pl=42,pr=8,pt=24,pb=30,n=series.length;
  var vals=series.map(function(s){return mode==='sales'?s.sales:s.units;});
  var max=niceMax(Math.max.apply(null,vals.concat([mode==='sales'?100:4])));
  var fmt=function(v){return mode==='sales'?compact(v):String(Math.round(v));};
  var ph=H-pt-pb,bw=(W-pl-pr)/n,out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly '+(mode==='sales'?'sales':'products sold')+' for the last six months">';
  [0,.5,1].forEach(function(f){
    var y=pt+ph-f*ph;
    out+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/>';
    out+='<text class="t" x="'+(pl-8)+'" y="'+(y+3.5)+'" text-anchor="end">'+fmt(max*f)+'</text>';
  });
  series.forEach(function(s,i){
    var v=vals[i],h=v/max*ph,x=pl+i*bw+bw*.2,w=bw*.6,y=pt+ph-h;
    if(v>0)out+='<rect class="b'+(i===n-1?' now':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,2).toFixed(1)+'" rx="5"/>';
    else out+='<rect class="b" x="'+x.toFixed(1)+'" y="'+(pt+ph-2)+'" width="'+w.toFixed(1)+'" height="2" rx="1"/>';
    if(v>0)out+='<text class="tv" x="'+(x+w/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+fmt(v)+'</text>';
    out+='<text class="t" x="'+(x+w/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(s.label)+'</text>';
  });
  return out+'</svg>';
}

/* ---------- views ---------- */
function head(){
  var t=S.tab,h;
  if(t!=='summary')return '';
  var fn=firstWord(myName());h=[greet()+(fn?', '+fn:'')+'.','Here is how Jhumka is doing.'];
  return '<div class="eyebrow">'+esc(TABS[t].label)+' · '+esc(dateLine())+'</div><h1>'+esc(h[0])+'<span>'+esc(h[1])+'</span></h1>';
}
function hasSample(){return COLS.some(function(c){return S[c].some(function(x){return x.sample;});})||S.team.some(function(x){return x.sample;});}
function banners(){
  var out='';
  if(S.offline)out+='<div class="note">Entries are saved in this browser on this device only.</div>';
  else if(!S.canWrite)out+='<div class="note">You can view these books. Only people with edit access can change them.</div>';
  if(hasSample()&&S.canWrite)out+='<div class="note"><span>Sample entries are showing so you can see how the tool works.</span><button type="button" data-act="clearsamples" id="clr">Remove all samples</button></div>';
  return out;
}
function emptyBlock(title,text,kind,btn){
  return '<div class="empty"><b>'+esc(title)+'</b><p>'+esc(text)+'</p>'+(S.canWrite&&!(kind==='product'&&!P('editProducts'))?'<button class="btn primary sm" type="button" data-act="new" data-kind="'+kind+'">'+esc(btn)+'</button>':'')+'</div>';
}
function statsCard(lbl,pillTxt,aLbl,aVal,bLbl,bVal,extra,wide){
  return '<section class="card'+(wide?' wide':'')+'"><div class="card-h"><span class="lbl">'+lbl+'</span><span class="pill">'+pillTxt+'</span></div>'+
    '<div class="stats"><div><div class="slbl">'+aLbl+'</div><div class="big">'+aVal+'</div>'+(extra||'')+'</div><div><div class="slbl">'+bLbl+'</div><div class="big">'+bVal+'</div></div></div></section>';
}
function targetCard(m){
  var key=m.cur.key,t=targetFor(key),done=Math.max(0,m.cur.orders),now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),day=now.getDate();
  var live=S.offline?'':'<span class="live"><i></i>Live</span>',mg=P('manage')&&S.canWrite;
  var h='<section class="card wide" id="tgt"><div class="card-h"><span class="lbl">Monthly target</span><span class="hrow">'+live+'<span class="pill">'+esc(m.monthName)+'</span></span></div>';
  if(!t){
    return h+'<div class="empty"><b>No target set for this month.</b><p>'+(mg?'Set how many orders you want this month and watch it count down as orders come in.':'The owner has not set an order target yet.')+'</p>'+
      (mg?'<button class="btn primary sm" type="button" data-act="target">Set target</button>':'')+'</div></section>';
  }
  var left=Math.max(0,t-done),dl=dim-day+1,pct=Math.min(100,Math.round(done/t*100)),proj=Math.round(done/day*dim),reached=done>=t;
  var st=reached?['Target reached','ok']:(proj>=t?['On track','ok']:['Behind pace','bad']);
  var big=reached?('Done'+(done>t?'<small> '+(done-t)+' over target</small>':'')):(left+'<small> '+(left===1?'order':'orders')+' left</small>');
  return h+'<div class="tgt"><div class="tgt-top"><div class="tgt-n">'+big+'</div><span class="st '+st[1]+'">'+st[0]+'</span></div>'+
    '<div class="track tall'+(reached?' done':'')+'" role="progressbar" aria-valuemin="0" aria-valuemax="'+t+'" aria-valuenow="'+Math.min(done,t)+'" aria-label="Orders this month against the target"><div class="fill" style="width:'+pct+'%"></div></div></div>'+
    '<div class="kv"><span>Orders so far</span><b>'+done+' of '+t+' ('+pct+'%)</b></div>'+
    '<div class="kv"><span>Days left this month</span><b>'+dl+'</b></div>'+
    (reached?'':'<div class="kv"><span>Needed per day</span><b>'+(Math.ceil(left/dl*10)/10)+' orders</b></div>')+
    '<div class="kv"><span>At this pace</span><b>about '+proj+' orders by month end</b></div>'+
    '<p class="cap">Each recorded sale counts as one order. Fully returned orders are not counted.</p>'+
    (mg?'<div class="cta"><button class="btn sm" type="button" data-act="target">Change target</button></div>':'')+'</section>';
}
function cmpRow(lbl,a,b,fmt,inv){
  var ch;
  if(!a&&!b)ch='<span class="delta">—</span>';
  else if(!b)ch='<span class="delta '+(inv?'down':'up')+'">▲ New</span>';
  else{
    var p=Math.round((a-b)/Math.abs(b)*100);
    if(p===0)ch='<span class="delta">▬ 0%</span>';
    else{var up=p>0,good=inv?!up:up;ch='<span class="delta '+(good?'up':'down')+'">'+(up?'▲ ':'▼ ')+Math.abs(p)+'%</span>';}
  }
  return '<div class="cmp"><span class="cl">'+lbl+'</span><b>'+fmt(a)+'</b><span class="cp">'+fmt(b)+'</span>'+ch+'</div>';
}
function sgn(n){n=Math.round(n*100)/100;return (n<0?'−':'')+money(Math.abs(n));}
function cmpCard(m){
  var a=m.cur,b=m.prev,own=P('profit');
  var rows=cmpRow('Orders',a.orders,b.orders,String)+cmpRow('Sales',a.sales,b.sales,sgn)+cmpRow('Pieces sold',a.units,b.units,String)+
    cmpRow('Average order',a.orders?Math.round(a.sales/a.orders):0,b.orders?Math.round(b.sales/b.orders):0,sgn);
  if(own)rows+=cmpRow('Expenses',a.exp,b.exp,sgn,true)+cmpRow('Profit',a.profit,b.profit,sgn);
  return '<section class="card wide" id="cmp"><div class="card-h"><span class="lbl">This month vs last month</span><span class="pill">'+esc(a.label)+' vs '+esc(b.label)+'</span></div>'+
    '<div class="cmp h"><span></span><span>'+esc(a.label)+'</span><span>'+esc(b.label)+'</span><span></span></div>'+rows+'</section>';
}
function collectCard(wide){
  var list=S.sales.filter(function(s){return dueOf(s)>0;}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'');}),tot=0;
  list.forEach(function(s){tot+=dueOf(s);});
  var body=list.length?'<div class="rows">'+list.slice(0,6).map(function(s){
    return '<div class="row">'+thumb(byProduct(s.itemNo),'img',s.name)+'<div><div class="r-t">'+esc(s.customerName||'Customer')+'<span class="tag warn">'+(payOf(s)==='cod'?'COD':'Pending')+'</span></div><div class="r-s">'+esc(s.name)+' · '+esc(fmtD(s.date))+'</div></div>'+
      '<div class="r-a">'+money(dueOf(s))+(S.canWrite?'<button class="row-btn" type="button" data-act="markpaid" data-id="'+esc(s.id)+'" style="display:block;margin:6px 0 0 auto">Mark paid</button>':'')+'</div></div>';
  }).join('')+'</div>'+(list.length>6?'<p class="cap">And '+(list.length-6)+' more. Open Customers to see them all.</p>':''):'<div class="empty"><b>Nothing to collect.</b><p>Every order is marked paid.</p></div>';
  return '<section class="card'+(wide?' wide':'')+'" id="collect"><div class="card-h"><span class="lbl">Money to collect</span><span class="pill">'+money(tot)+'</span></div>'+body+'</section>';
}
function returnsCard(m){
  var pcs=0;S.returns.forEach(function(r){if(mkey(r.date)===m.cur.key)pcs+=+r.qty||0;});
  return statsCard('Returns and damages',esc(m.monthName),'Refunded',money(m.cur.refunds),'Pieces',pcs+' pcs');
}
function actRows(n){
  var list=S.activity.filter(function(a){return P('exp')||a.kind!=='expense';}).sort(function(a,b){return (b.at||0)-(a.at||0);}).slice(0,n);
  if(!list.length)return {n:0,html:'<div class="empty"><b>No activity yet.</b><p>Every change your team makes shows up here.</p></div>'};
  return {n:list.length,html:'<div class="rows">'+list.map(function(a){
    var you=a.by===S.me.id||(S.offline&&a.by==='local');
    return '<div class="row"><div class="thumb round" aria-hidden="true">'+esc(firstChar(a.who)||'?')+'</div><div><div class="r-t">'+esc(a.who||'Someone')+(you?'<span class="you">You</span>':'')+(a.sample?'<span class="you">Demo</span>':'')+' '+esc(a.verb)+' '+esc(a.text)+'</div><div class="r-s">'+esc(fmtDT(a.at))+'</div></div><div class="r-a"><small>'+esc(ago(a.at))+'</small></div></div>';
  }).join('')+'</div>'};
}
function activityCard(n){
  if(!P('activity'))return '';
  var a=actRows(n);
  return '<section class="card wide" id="activity"><div class="card-h"><span class="lbl">Activity</span><span class="pill">'+a.n+'</span></div>'+a.html+'</section>';
}
function recentActivity(){
  if(!P('activity'))return '';
  var a=actRows(5);
  return '<section class="card wide" id="recent"><div class="card-h"><span class="lbl">Recent activity</span><button class="pill" type="button" data-act="profile" style="border:0">See all</button></div>'+a.html+'</section>';
}
function backupBanner(){
  if(!P('export'))return '';
  var real=['products','purchases','expenses','customers','sales','returns'].some(function(c){return S[c].some(function(x){return !x.sample;});});
  if(!real)return '';
  var last=S.lastBackup,days=last?Math.floor((Date.now()-last)/86400000):0;
  if(last&&days<30)return '';
  return '<div class="note" id="bkbanner"><span>'+(last?'Your last backup was '+days+' days ago.':'You have not backed up your books yet.')+' Download a backup once a month.</span><button type="button" data-act="backupnow">Back up now</button></div>';
}
function viewSummary(){
  var m=metrics(),own=P('profit'),cur=m.cur,prev=m.prev,chartTxt;
  var out=head()+backupBanner()+banners()+targetCard(m);
  if(!P('money')){
    return out+statsCard('Orders',esc(m.monthName),'This month',cur.orders+' orders','All time',m.tot.orders+' orders',delta(cur.orders,prev.orders,prev.label))+
      statsCard('Products sold',esc(m.monthName),'This month',m.monthUnits+' pcs','All time',m.totalUnits+' pcs',delta(m.monthUnits,m.prevUnits,m.prevLabel));
  }
  if(S.chart==='sales')chartTxt=m.totalSales?('This month so far: '+money(cur.sales)+'. '+esc(prev.label)+': '+money(prev.sales)+'.'):'Record your first sale to see growth here.';
  else chartTxt=m.totalUnits?('This month so far: '+cur.units+' pieces. '+esc(prev.label)+': '+prev.units+' pieces.'):'Record your first sale to see growth here.';
  out+=cmpCard(m)+
    statsCard('Sales',esc(m.monthName),'This month',money(m.monthSales),'All time',money(m.totalSales),delta(m.monthSales,m.prevSales,m.prevLabel))+
    statsCard('Products sold',esc(m.monthName),'This month',m.monthUnits+' pcs','All time',m.totalUnits+' pcs',delta(m.monthUnits,m.prevUnits,m.prevLabel))+
    '<section class="card"><div class="card-h"><span class="lbl">Growth</span><div class="seg" role="group" aria-label="Chart measure">'+
      '<button type="button" data-act="chart" data-mode="sales" aria-pressed="'+(S.chart==='sales')+'">Sales</button>'+
      '<button type="button" data-act="chart" data-mode="units" aria-pressed="'+(S.chart==='units')+'">Products</button></div></div>'+
      chartSVG(m.series,S.chart)+'<p class="cap">'+chartTxt+'</p></section>'+
    returnsCard(m);
  if(own)out+='<section class="card"><div class="card-h"><span class="lbl">Money</span><span class="pill">All time</span></div>'+
      '<div class="kv"><span>Sales</span><b>'+money(m.totalSales)+'</b></div>'+
      '<div class="kv"><span>Cost of items sold</span><b>'+money(m.cogs)+'</b></div>'+
      '<div class="kv"><span>Expenses</span><b>'+money(m.exp)+'</b></div>'+
      '<div class="kv"><span>Damaged or lost stock</span><b>'+money(m.loss)+'</b></div>'+
      '<div class="kv total"><span>Profit</span><b class="'+(m.profit>=0?'pos':'neg')+'">'+(m.profit<0?'−':'')+money(Math.abs(m.profit))+'</b></div>'+
      '<div class="kv"><span>Stock bought so far</span><b>'+money(m.buy)+'</b></div></section>';
  return out+collectCard(!own)+recentActivity();
}
function thumb(r,key,fallback,round){
  var src=imgSrc(r,key);
  if(src)return '<img class="thumb'+(round?' round':'')+'" src="'+esc(src)+'" alt="" loading="lazy">';
  return '<div class="thumb'+(round?' round':'')+'" aria-hidden="true">'+esc((fallback||'?').trim().charAt(0).toUpperCase())+'</div>';
}

  var m=metrics(),cur=m.series[5].key,spentM=0,spentAll=0;

    '<section class="card wide"><div class="card-h"><span class="lbl">All purchases</span><span class="pill">'+list.length+'</span></div>'+body+'</section>';

function pl(n,w){return n+' '+w+(n===1?'':'s');}
function inRange(d,r){
  if(!r.from&&!r.to)return true;
  var lo=r.from,hi=r.to;if(lo&&hi&&lo>hi){var t=lo;lo=hi;hi=t;}
  d=d||'';return (!lo||d>=lo)&&(!hi||d<=hi);
}
function rngActive(r){return !!(r.from||r.to);}

function avInner(photo,name){var p=safePhoto(photo);return p?'<img alt="" src="'+p+'">':esc(firstChar(name)||'?');}
function squareThumb(file,size,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,m=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=size;
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);
      x.drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,size,size);URL.revokeObjectURL(url);
      try{res(c.toDataURL('image/jpeg',q));}catch(e){rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('decode'));};
    im.src=url;
  });
}

var SUN=svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',1.8);
var MOON=svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',1.8);
var THEME_KEY='jhumka-theme';
var THEMES=['light','dark'];
var THEME_NAMES={light:'light',dark:'dark'};
function currentTheme(){
  var t=document.documentElement.getAttribute('data-theme');
  if(THEMES.indexOf(t)>=0)return t;
  return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
}
function nextTheme(){return THEMES[(THEMES.indexOf(currentTheme())+1)%THEMES.length];}
function paintTheme(){
  var b=$('#themebtn');if(!b)return;var n=nextTheme();
  b.innerHTML=n==='light'?SUN:MOON;
  b.setAttribute('aria-label','Switch to '+THEME_NAMES[n]+' theme');
  b.title='Switch to '+THEME_NAMES[n]+' theme';
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
  paintTheme();
}
try{var savedTheme=localStorage.getItem(THEME_KEY);if(THEMES.indexOf(savedTheme)>=0)document.documentElement.setAttribute('data-theme',savedTheme);}catch(e){}
try{if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);}catch(e){}

/* ---------- images ---------- */
function shrink(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',q);
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('decode'));};
    im.src=url;
  });
}
function toDataURL(blob){return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(f.result);};f.onerror=rej;f.readAsDataURL(blob);});}
async function resolveImg(key,rec){
  var p=PEND[key],o={};
  if(p==='remove'){o[key+'Id']=null;o[key+'Data']=null;return o;}
  if(p&&p.file){
    if(ASSETS){
      try{var up=await ASSETS.upload(p.blob,{type:'image/jpeg'});o[key+'Id']=up.id;o[key+'Data']=null;return o;}catch(e){}
    }
    var small=await shrink(p.file,key==='bill'?900:480,.65);
    o[key+'Id']=null;o[key+'Data']=await toDataURL(small);return o;
  }
  o[key+'Id']=rec&&rec[key+'Id']||null;o[key+'Data']=rec&&rec[key+'Data']||null;return o;
}

/* ---------- extract customer info ---------- */
function extractInfo(text){
  var t=String(text||'').replace(/\r/g,''),phone='',pin='',name='',m;
  var re=/\+?\d[\d\s\-]{8,}\d/g;
  while((m=re.exec(t))){
    var d=m[0].replace(/\D/g,'');
    if(d.length>=12&&d.slice(0,2)==='91')d=d.slice(-10);
    else if(d.length===11&&d.charAt(0)==='0')d=d.slice(1);
    if(d.length===10&&/^[6-9]/.test(d)){phone=d;t=t.slice(0,m.index)+' '+t.slice(m.index+m[0].length);break;}
  }
  m=/(?:pin\s*code|pincode|pin|zip)\s*[:\-]?\s*([1-9]\d{2}\s?\d{3})\b/i.exec(t)||/\b([1-9]\d{2}\s?\d{3})\b/.exec(t);
  if(m)pin=m[1].replace(/\s/g,'');
  m=/(?:^|\n)\s*(?:customer\s*)?name\s*[:\-]\s*([^\n]+)/i.exec(t);
  if(m)name=m[1].trim();
  else{
    var lines=t.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    for(var i=0;i<lines.length;i++){
      var l=lines[i].replace(/^(to|dear|hi|hello)[,:\s]+/i,'').replace(/[,.]+$/,'').trim();
      if(l&&!/\d/.test(l)&&l.length<=40&&!/[:@]/.test(l)){name=l;break;}
    }
  }
  return {name:name,phone:phone,pin:pin};
}

function normH(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function parseTable(text){
  text=String(text||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  var first=text.split('\n')[0]||'',d=first.indexOf('\t')>=0?'\t':(first.split(';').length>first.split(',').length?';':',');
  var rows=[],row=[],cur='',q=false,i,c;
  for(i=0;i<text.length;i++){
    c=text.charAt(i);
    if(q){if(c==='"'){if(text.charAt(i+1)==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"'&&cur==='')q=true;
    else if(c===d){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=c;
  }
  row.push(cur);rows.push(row);
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
}
function pnum(s){var n=parseFloat(String(s==null?'':s).replace(/rs\.?|[₹,\s]/gi,''));return isFinite(n)?n:NaN;}
function okDate(y,mo,d){if(mo<1||mo>12||d<1||d>31)return '';var dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1)return '';return y+'-'+pad(mo)+'-'+pad(d);}
function parseDate(s){
  s=String(s==null?'':s).trim();if(!s)return '';
  var m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s);
  if(m)return okDate(+m[1],+m[2],+m[3]);
  m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(s);
  if(m){var a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;return okDate(y,b,a)||okDate(y,a,b);}
  var t=Date.parse(s);
  return isFinite(t)?iso(new Date(t)):'';
}

function impGet(row,k){var ix=IMP.map[k];return (ix>=0&&ix<row.length)?String(row[ix]).trim():'';}
function importBuild(forRun){
  var t=IMP.table,out={},bad=[],ok=0,dups=0,newCats=[],now=Date.now(),custs=S.customers.slice(),prods=S.products.slice();
  function nid(c){return forRun?newId(c):'x';}
  function add(c,id,d){(out[c]=out[c]||[]).push({id:id,data:d});}
  function g(row,k){return impGet(row,k);}
  function findProd(no){var id=slug(no);return prods.filter(function(p){return p.id===id;})[0];}
  t.rows.forEach(function(row,ri){
    var n=ri+2,ca=now+ri,why='',date,no,nm;
    if(IMP.type==='purchases'){
      date=parseDate(g(row,'date'));no=g(row,'itemNo');nm=g(row,'name');
      var rate=pnum(g(row,'rate')),qty=Math.round(pnum(g(row,'qty')));
      if(!date)why='date not understood';else if(!no||!slug(no))why='item number missing';else if(!nm)why='name missing';else if(!(rate>0))why='rate missing';else if(!(qty>=1))why='quantity missing';
      if(why){bad.push('Row '+n+': '+why);return;}
      add('purchases',nid('purchases'),{date:date,itemNo:no,name:nm,rate:rate,qty:qty,total:r2(rate*qty),createdAt:ca});
      if(!findProd(no)){prods.push({id:slug(no),itemNo:no,name:nm,ourPrice:rate});add('products',slug(no),{itemNo:no,name:nm,ourPrice:rate,sellPrice:0,createdAt:ca});}
      ok++;
    }else if(IMP.type==='expenses'){
      date=parseDate(g(row,'date'));
      var cat=g(row,'category').slice(0,40),amt=pnum(g(row,'amount')),cnt=Math.round(pnum(g(row,'count')))||1;
      if(!date)why='date not understood';else if(!cat)why='type missing';else if(!(amt>0))why='amount missing';else if(cnt<1)why='count must be 1 or more';
      if(why){bad.push('Row '+n+': '+why);return;}
      var known=S.cats.concat(newCats).filter(function(c){return c.toLowerCase()===cat.toLowerCase();})[0];
      if(known)cat=known;else newCats.push(cat);
      add('expenses',nid('expenses'),{date:date,category:cat,amount:amt,count:cnt,total:r2(amt*cnt),createdAt:ca});
      ok++;
    }else if(IMP.type==='customers'){
      nm=g(row,'name');var ph=normPhone(g(row,'phone')),pin=g(row,'pin').replace(/\D/g,'');
      if(!nm)why='name missing';else if(ph.length!==10)why='phone must have 10 digits';
      if(why){bad.push('Row '+n+': '+why);return;}
      if(custs.some(function(c){return c.phone===ph;})){dups++;return;}
      custs.push({id:'x',name:nm,phone:ph});
      add('customers',nid('customers'),{name:nm.slice(0,60),phone:ph,pin:pin.length===6?pin:'',createdAt:ca});
      ok++;
    }else if(IMP.type==='products'){
      no=g(row,'itemNo');nm=g(row,'name');
      var our=pnum(g(row,'ourPrice')),sell=pnum(g(row,'sellPrice'));
      if(!no||!slug(no))why='item number missing';else if(!nm)why='name missing';
      if(why){bad.push('Row '+n+': '+why);return;}
      if(findProd(no)){dups++;return;}
      prods.push({id:slug(no),itemNo:no,name:nm,ourPrice:our>0?our:0,sellPrice:sell>0?sell:0});
      add('products',slug(no),{itemNo:no,name:nm.slice(0,80),ourPrice:our>0?our:0,sellPrice:sell>0?sell:0,createdAt:ca});
      ok++;
    }else if(IMP.type==='sales'){
      date=parseDate(g(row,'date'));no=g(row,'itemNo');var key=g(row,'customer'),sq=Math.round(pnum(g(row,'qty')))||1,pr=pnum(g(row,'price')),pv=g(row,'pay');

      if(!date)why='date not understood';else if(!key)why='customer missing';else if(!no)why='item number missing';else if(!p)why='unknown item number '+no;else if(!(price>0))why='price missing';else if(sq<1)why='quantity must be 1 or more';
      if(why){bad.push('Row '+n+': '+why);return;}
      var digits=normPhone(key),c=custs.filter(function(x){return (digits.length===10&&x.phone===digits)||(x.name||'').toLowerCase()===key.toLowerCase();})[0];
      if(!c){

        add('customers',c.id,{name:c.name,phone:c.phone,pin:'',createdAt:ca});
      }
      var pay=/pend|due|unpaid|credit|balance/i.test(pv)?'pending':(/cod|cash on/i.test(pv)?'cod':'paid');
      add('sales',nid('sales'),{date:date,customerId:c.id,customerName:c.name,itemNo:p.itemNo,name:p.name,qty:sq,price:price,total:r2(price*sq),cost:+p.ourPrice||0,pay:pay,createdAt:ca});
      ok++;
    }
  });
  return {out:out,ok:ok,bad:bad,dups:dups,newCats:newCats};
}

function cleanBackupRec(x){

      var b=importBuild(true),order=['customers','products','purchases','expenses','sales'],i;
      if(!b.ok)throw {msg:'Nothing to import. Check which column matches each field.'};
      for(i=0;i<order.length;i++){var l=b.out[order[i]];if(l&&l.length)await bulkPut(order[i],l);}
      if(b.newCats.length)await saveCats(S.cats.concat(b.newCats));
      total=b.ok;
    }
    var label=IMP.type==='backup'?'entries from a backup':IMPORTS[IMP.type].label.toLowerCase();
    logAct('other','imported',total+' '+label+' from a file');
    closeSheet();render();toast('Imported '+total+(total===1?' entry':' entries'));
  }catch(e){
    var er=$('#err');if(er)er.textContent=(e&&e.msg)?e.msg:errText(e);
    if(btn){btn.disabled=false;btn.textContent='Try again';}
  }
}

/* ---------- scan and QR ---------- */
async function decodeCode(file){
  var bmp=await createImageBitmap(file);
  if(window.BarcodeDetector){
    try{var res=await new window.BarcodeDetector().detect(bmp);if(res&&res.length)return String(res[0].rawValue||'');}catch(e){}
  }
  if(typeof window.jsQR!=='function')return '';
  var k=Math.min(1,1000/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k)),c=document.createElement('canvas');
  c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(bmp,0,0,w,h);
  var d=x.getImageData(0,0,w,h),r=window.jsQR(d.data,w,h);
  return r?String(r.data):'';
}
function gotCode(v,tg){
  v=String(v||'').trim();
  if(!v){toast('No code found in that photo. Try again, closer and in good light.');return;}
  var p=byProduct(v);
  if(tg==='p-no'||tg==='d-no'){var el=$('#'+tg);if(el&&!el.readOnly){el.value=v;if(tg==='p-no')hintItem();}toast('Scanned '+v);return;}
  if(tg==='s-prod'){if(!p){toast('No product with item number '+v);return;}$('#s-prod').value=p.id;sprodChange();toast('Scanned '+v);return;}
  if(tg==='q'){S.q=v;var qi=$('#q');if(qi)qi.value=v;var pe=$('#plist');if(pe)pe.innerHTML=productRows();toast('Scanned '+v);}
}
function qrCanvas(p){
  var qr=window.qrcode(0,'M');qr.addData(String(p.itemNo));qr.make();
  var n=qr.getModuleCount(),W=640,H=760,cell=Math.max(1,Math.floor(500/n)),sz=cell*n,c=document.createElement('canvas');
  c.width=W;c.height=H;
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';
  var ox=Math.round((W-sz)/2),oy=60,r,k;
  for(r=0;r<n;r++)for(k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect(ox+k*cell,oy+r*cell,cell,cell);
  x.textAlign='center';x.font='700 54px sans-serif';x.fillText(String(p.itemNo),W/2,oy+sz+80);
  x.font='500 30px sans-serif';x.fillStyle='#444';x.fillText(String(p.name||'').slice(0,34),W/2,oy+sz+130);
  x.font='600 22px sans-serif';x.fillStyle='#777';x.fillText('Jhumka',W/2,H-30);
  return c;
}

document.addEventListener('input',function(e){
  var t=e.target;

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-from'||t.id==='f-to'){var rr=S.rng[S.tab];if(rr){rr[t.id==='f-from'?'from':'to']=t.value;render();}return;}
  if(t.id==='s-prod'){sprodChange();}
  if(t.id==='s-cust')custLast();
  if(t.id==='r-kind')retToggle();
  if(t.id==='r-sale')recalc('r-sale');
  if(t.dataset&&t.dataset.rolefor){setRole(t.dataset.rolefor,t.value,t.dataset.nm);return;}
  if(t.id==='scan-file'&&t.files&&t.files[0]){
    var sf=t.files[0],stg=SCAN_T;toast('Reading the code…');
    decodeCode(sf).then(function(v){gotCode(v,stg);}).catch(function(){toast('Could not read a code from that photo. Try again, closer and in good light.');});
    return;
  }
  if(IMP&&t.id==='imp-type'){var tx=$('#imp-text');if(tx)IMP.text=tx.value;IMP.type=t.value;IMP.step='pick';IMP.err='';repaintImp();return;}
  if(IMP&&t.dataset&&t.dataset.mapk){IMP.map[t.dataset.mapk]=+t.value;repaintImp(true);return;}
  if(IMP&&t.id==='imp-file'&&t.files&&t.files[0]){
    var f=t.files[0];
    if(f.size>6e6){IMP.err='That file is too large. Use a smaller one.';repaintImp();return;}
    var fr=new FileReader();
    fr.onload=function(){if(!IMP)return;if(IMP.type==='backup')impBackupParse(String(fr.result));else{IMP.text=String(fr.result);impRead();}};
    fr.onerror=function(){if(IMP){IMP.err='Could not read that file.';repaintImp();}};
    fr.readAsText(f);return;
  }
  if(t.dataset&&t.dataset.photo&&t.files&&t.files[0]){
    var prev=$('#pf-prev');prev.textContent='Loading\u2026';
    squareThumb(t.files[0],192,.82).then(function(u){PEND.photo={data:u};prev.innerHTML='<img alt="" src="'+u+'">';})

  if(t.dataset&&t.dataset.imgkey&&t.files&&t.files[0]){
    var key=t.dataset.imgkey,file=t.files[0],box=$('#ip-'+key);
    box.textContent='Loading…';

      PEND[key]={file:file,blob:blob};

    }).catch(function(){box.textContent='No image';setErr('That photo format is not supported. Use a JPG or PNG photo.');});
  }
});

async function boot(){
  try{DB=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){DB=null;}
  try{ASSETS=window.claude&&window.claude.use?await window.claude.use('assets'):null;}catch(e){ASSETS=null;}
  try{
    U=window.claude&&window.claude.use?await window.claude.use('user'):null;
    if(U&&U.can){var ok=await Promise.resolve(U.can('data.write'));if(ok===false)S.canWrite=false;}
  }catch(e){}
  await identify();
  try{DL=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){DL=null;}
  BOOTED=true;
  if(!DB){
    S.offline=true;loadLocal();
    try{S.lastBackup=+localStorage.getItem('jhumka-lastbackup')||0;}catch(e){}
    var fresh=false;try{fresh=localStorage.getItem(LS)===null&&localStorage.getItem(DEMO_OFF_KEY)===null;}catch(e){}
    if(fresh){var dm=demoData();COLS.forEach(function(c){S[c]=dm[c]||[];});saveLocal();}
    loadProfileLocal();S.loaded=true;render();startLocalProfile();return;}
  COLS.forEach(function(c){
    DB.collection(c).onSnapshot(function(snap){
      S[c]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});
      S.got[c]=true;if(COLS.every(function(k){return S.got[k];}))S.loaded=true;
      render();
    },function(){S.got[c]=true;if(COLS.every(function(k){return S.got[k];}))S.loaded=true;render();});
  });
  DB.doc('config/settings').onSnapshot(function(s){
    if(s.exists&&Array.isArray(s.data().cats))S.cats=s.data().cats.slice();
    var sel=$('#e-cat');if(sel)refreshCats();
  },function(){});
  DB.doc('config/backup').onSnapshot(function(s){
    S.lastBackup=(s.exists&&+s.data().at)||0;render();
  },function(){});
  DB.collection('team').onSnapshot(function(snap){
    S.team=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});
    var mine=S.team.filter(function(x){return x.id===S.me.id;})[0];
    if(mine){S.me.name=mine.name||'';S.me.title=mine.title||'';S.me.phone=mine.phone||'';S.me.photo=safePhoto(mine.photo);S.me.setup=!!mine.setup;S.me.logins=Array.isArray(mine.logins)?mine.logins:[];}
    S.teamReady=true;render();
  },function(){S.teamReady=true;render();});
  hostedSignIn();
}
boot();
})();
